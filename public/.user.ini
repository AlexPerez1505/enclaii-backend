; Limites de PHP para hosting compartido (Hostinger y similares) que no dan
; acceso a php.ini directamente. Este archivo se respeta por directorio en
; PHP-FPM/LiteSpeed sin necesidad de acceso root.
;
; La subida de video por partes (chunks) manda el video completo en pedazos
; pequenos, asi que estos valores solo necesitan cubrir UN chunk (ver
; VIDEO_CHUNK_SIZE_BYTES en src/main.js del proyecto endoscopy-capture), no
; el video completo. Se deja margen amplio para no depender de que el
; tamano de chunk elegido en el cliente coincida exactamente con esto.
upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
